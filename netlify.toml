# Netlify site config for the frontend (Next.js App Router, `frontend/`).
# The backend (Railway) and database (Supabase) are configured separately —
# see docs/DEPLOYMENT.md.
[build]
  base = "frontend"
  command = "npm run build"
  # Relative to `base` — the Next.js Runtime plugin needs this distinct from
  # `base` itself (it manages .next as Netlify Functions + CDN assets, not a
  # plain static publish dir). Set explicitly because this site's dashboard
  # had "Publish directory" manually set to `frontend` (same as base) from
  # initial site setup, which the plugin refuses outright — if this doesn't
  # take effect, clear/update that field directly in Site configuration >
  # Build & deploy > Build settings, since a UI-set value can outrank this file.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Precautionary headroom above Node's default old-space ceiling (~2GB) for
  # an 87-page Next.js build — not confirmed necessary (the actual cause of
  # this build's earlier static-generation hangs was untimed backend fetches
  # in the root layout, since fixed), but harmless to leave raised.
  NODE_OPTIONS = "--max-old-space-size=4096"

# Runs the official Next.js Runtime — handles SSR/ISR/route handlers as
# Netlify Functions and static assets via the CDN automatically. Netlify
# installs this even though it isn't in frontend/package.json.
[[plugins]]
  package = "@netlify/plugin-nextjs"
