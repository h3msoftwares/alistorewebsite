# Ali's Store API — Nginx reverse proxy for the VPS deployment.
#   sudo cp deploy/nginx/alistore.conf /etc/nginx/sites-available/alistore
#   sudo ln -s /etc/nginx/sites-available/alistore /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS: run `sudo certbot --nginx -d api.your-domain.com` after first install;
# certbot rewrites the listen 443 / ssl_certificate lines below.

# Per-endpoint abuse throttles. These are a coarse network-layer backstop IN
# ADDITION TO the app's own express-rate-limit buckets — sized well above real
# store traffic so they only catch floods. Tune from the measured numbers:
# the API saturates one vCPU at ~30 req/s, so 30 r/s sustained per IP is
# already pathological for a single client.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=1r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

upstream alistore_api {
    server 127.0.0.1:4000;
    keepalive 32;               # reuse upstream connections
}

# --- HTTP: redirect everything to HTTPS ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.your-domain.com;

    # Let certbot's HTTP-01 challenge through, redirect the rest.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS: the real vhost ------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.your-domain.com;

    # certbot fills these in:
    ssl_certificate     /etc/letsencrypt/live/api.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The app is a JSON API; it already sets its own security headers (helmet).
    # Add HSTS here too so it's present even on an Nginx-level error page.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Request body: the API's express.json() limit is 100 kb. Give a small
    # margin and reject anything larger at the edge, before it reaches Node.
    client_max_body_size 128k;
    client_body_timeout  15s;
    client_header_timeout 15s;

    # Compress JSON responses (the app ships none itself).
    gzip on;
    gzip_types application/json;
    gzip_min_length 512;
    gzip_proxied any;

    # Global connection cap per IP (slow-loris / socket exhaustion backstop).
    limit_conn api_conn 20;

    # Health probe — no rate limit, no logging noise.
    location = /health {
        proxy_pass http://alistore_api;
        access_log off;
        proxy_read_timeout 5s;
    }

    # Auth endpoints — the brute-force surface. Tight rate + small burst.
    location ~ ^/api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://alistore_api;
        include /etc/nginx/snippets/alistore-proxy.conf;
    }

    # Checkout — the app currently has NO limiter here (audit finding). This is
    # the edge backstop until the app-level fix ships.
    location = /api/orders/checkout {
        limit_req zone=api_auth burst=20 nodelay;
        proxy_pass http://alistore_api;
        include /etc/nginx/snippets/alistore-proxy.conf;
    }

    # Everything else.
    location / {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://alistore_api;
        include /etc/nginx/snippets/alistore-proxy.conf;
    }

    access_log /var/log/nginx/alistore.access.log;
    error_log  /var/log/nginx/alistore.error.log;
}
