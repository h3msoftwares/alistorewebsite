# Shared proxy directives — install at /etc/nginx/snippets/alistore-proxy.conf
proxy_http_version 1.1;
proxy_set_header Connection "";                 # keep upstream keepalive
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Timeouts. The app should set server.headersTimeout/keepAliveTimeout ABOVE
# these (see the audit's Express-config fix) so Nginx, not Node, is the side
# that closes an idle upstream socket — avoids the well-known 502 race.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;      # generous: checkout under contention can take ~10s

proxy_buffering on;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
