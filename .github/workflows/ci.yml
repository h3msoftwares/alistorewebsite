name: CI

on:
  push:
    branches: [main, 'Full/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend — typecheck · lint · test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alistore
          POSTGRES_PASSWORD: alistore
          POSTGRES_DB: alistore_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alistore"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Integration tests read TEST_DATABASE_URL (see backend/tests/helpers).
      TEST_DATABASE_URL: postgresql://alistore:alistore@localhost:5432/alistore_test?schema=public
      DATABASE_URL: postgresql://alistore:alistore@localhost:5432/alistore_test?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      # global-setup runs `prisma migrate deploy` against the test DB itself.
      - run: npm test

  frontend:
    name: Frontend — typecheck · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # Report only — does not block the merge, but surfaces new advisories.
      - run: cd backend && npm ci && npm audit --audit-level=high || true
      - run: cd frontend && npm ci && npm audit --audit-level=high || true

  lighthouse:
    name: Lighthouse CI (frontend budgets)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # No backend at build time — pages fall back to client fetch; the
          # LHCI run below still measures the shipped bundle + paint metrics.
          NEXT_PUBLIC_API_URL: http://localhost:4000
      # lighthouserc.json starts `npm start` itself and asserts the budgets.
      - run: npm run lhci

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger frontend (Vercel) deploy hook
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          else
            echo "VERCEL_DEPLOY_HOOK secret not set — skipping frontend deploy."
          fi
      - name: Trigger backend (Railway) deploy hook
        run: |
          if [ -n "${{ secrets.RAILWAY_DEPLOY_HOOK }}" ]; then
            curl -fsS -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK }}"
          else
            echo "RAILWAY_DEPLOY_HOOK secret not set — skipping backend deploy."
          fi
