name: Database backup

on:
  schedule:
    # Fires daily at 03:00 UTC (off-peak for every timezone this store ships
    # to), but `npm run backup:run` checks isBackupDueNow() first and skips
    # as a no-op unless the admin-configured cadence (daily/weekly/monthly,
    # default weekly — GET/PATCH /api/admin/backup/settings) says a backup is
    # actually due. A daily cron is simply the finest-grained "tick" that
    # covers every possible cadence; it does not mean backups happen daily.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

# Least-privilege default: this job only checks out the repo and calls out to
# Postgres/Google Drive — it never needs to write back to the repository or
# call the GitHub API, so the default broad GITHUB_TOKEN scope is unneeded.
permissions:
  contents: read

jobs:
  backup:
    name: pg_dump -> Google Drive
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # ubuntu-latest's own repo only ships postgresql-client-16, but pg_dump
      # refuses to dump a server NEWER than itself ("aborting because of
      # server version mismatch") — confirmed live here, same failure mode
      # backend/Dockerfile hit and fixed the same way (see its comment).
      # Supabase runs Postgres 17.6, so this pulls the official PGDG apt repo
      # for an explicit, pinned postgresql-client-17 instead of the distro
      # default.
      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - name: Run backup
        run: npm run backup:run
        env:
          # ubuntu-latest's runner image ALREADY ships postgresql-client-16
          # on PATH ahead of whatever gets apt-get installed afterward
          # (confirmed live: plain `pg_dump` still resolved to 16.15 even
          # after installing postgresql-client-17 above) — pointing directly
          # at PGDG's versioned binary path sidesteps that PATH/wrapper
          # ambiguity entirely instead of fighting update-alternatives.
          PG_DUMP_BIN: /usr/lib/postgresql/17/bin/pg_dump
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
          # Only needed once someone has used the admin panel's "Connect
          # Google Drive" at least once in production — that creates a
          # DriveCredential DB row, which (since this job shares the same
          # DATABASE_URL) then takes priority over GOOGLE_DRIVE_REFRESH_TOKEN
          # above and must be redeemed with THESE credentials instead — see
          # drive.client.ts's getEffectiveConnection. Safe to leave unset
          # until then.
          GOOGLE_DRIVE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_WEB_CLIENT_ID }}
          GOOGLE_DRIVE_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_WEB_CLIENT_SECRET }}
          # env.ts requires these to boot even though this run never serves
          # HTTP traffic — any 32+ char value works, it's never used here.
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'unused-in-backup-job-unused-in-backup-job' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'also-unused-in-backup-job-also-unused-xx' }}
